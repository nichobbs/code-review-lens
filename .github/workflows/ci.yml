name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to full commit SHAs (enforced by `npm run lint`); Dependabot keeps them current.
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Lint (syntax, banned patterns, SHA-pinned actions)
        run: npm run lint

      - name: Extension workbench is in sync with packages/ui
        run: npm run check-sync

      - name: Dependency audit
        run: npm run audit

      - name: Run unit and integration tests
        run: npm test

      - name: Run skill report verification
        run: node .agents/skills/crv-code-review/scripts/test_report.mjs
